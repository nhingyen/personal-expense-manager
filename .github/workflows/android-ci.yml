name: Android CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Ensure Android SDK platform is installed
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Prepare Firebase client configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          supplied = os.environ.get("FIREBASE_GOOGLE_SERVICES_JSON", "")
          try:
              config = json.loads(supplied) if supplied else json.loads(Path("app/google-services.example.json").read_text())
              packages = [client["client_info"]["android_client_info"]["package_name"] for client in config["client"]]
              if "com.ngyennhi.expensemanager" not in packages:
                  raise ValueError()
          except (ValueError, KeyError, TypeError):
              raise SystemExit("Firebase configuration is invalid or does not match the application ID.") from None
          Path("app/google-services.json").write_text(json.dumps(config), encoding="utf-8")
          print("Firebase config prepared: " + ("repository secret" if supplied else "non-production CI example (live auth unavailable)"))
          PY

      - name: Build, test, and lint
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
